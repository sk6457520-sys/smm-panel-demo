<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY SMM PANEL</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <h1>MY SMM PANEL</h1>
    <p>Social Media Services</p>
</header>

<main class="container">

    <section class="card wallet">
        <h2>Wallet Balance</h2>
        <div class="balance">₹100.00</div>
    </section>

    <section class="menu">
        <button onclick="showSection('dashboard')">Dashboard</button>
        <button onclick="showSection('order')">New Order</button>
        <button onclick="showSection('funds')">Add Funds</button>
        <button onclick="showSection('history')">Order History</button>
    </section>

    <section id="dashboard" class="card section">
        <h2>Dashboard</h2>

        <div class="stats">
            <div>
                <span>Wallet Balance</span>
                <strong>₹100.00</strong>
            </div>

            <div>
                <span>Total Orders</span>
                <strong id="totalOrders">0</strong>
            </div>
        </div>
    </section>

    <section id="order" class="card section hidden">
        <h2>New Order</h2>

        <label>Service</label>

        <select id="service">
            <option value="">Select Service</option>
            <option value="Instagram">Instagram Service</option>
            <option value="YouTube">YouTube Service</option>
            <option value="Facebook">Facebook Service</option>
            <option value="Telegram">Telegram Service</option>
        </select>

        <label>Link</label>

        <input
            type="url"
            id="orderLink"
            placeholder="Enter post/profile/channel link"
        >

        <label>Quantity</label>

        <input
            type="number"
            id="quantity"
            placeholder="Enter quantity"
            min="1"
        >

        <button class="main-btn" onclick="placeOrder()">
            Place Order
        </button>

        <p id="orderMessage"></p>
    </section>

    <section id="funds" class="card section hidden">
        <h2>Add Funds</h2>

        <label>Amount</label>

        <input
            type="number"
            id="fundAmount"
            placeholder="Enter amount"
            min="1"
        >

        <button class="main-btn" onclick="addFunds()">
            Add Funds
        </button>

        <p id="fundMessage"></p>
    </section>

    <section id="history" class="card section hidden">
        <h2>Order History</h2>

        <div id="orderList">
            <p>No orders yet.</p>
        </div>
    </section>

</main>

<footer>
    <p>© 2026 MY SMM PANEL</p>
</footer>

<script src="app.js"></script>

</body>
</html>
